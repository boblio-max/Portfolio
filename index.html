<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nikhil Mahankali — Science Portfolio</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<header class="nav">
  <a class="brand" href="#/all">Nikhil Mahankali</a>
  <nav aria-label="Primary">
    <a href="#/all" data-nav="all">All</a>
    <a href="#/hardware" data-nav="hardware">Hardware</a>
    <a href="#/repos" data-nav="repos">Repositories</a>
  </nav>
  <span class="spacer"></span>
  <span id="syncState" class="sync" title="Data source status">loading…</span>
  <div class="toggle-wrapper" id="themeToggle" role="switch" aria-checked="false" aria-label="Toggle dark mode" tabindex="0">
    <!-- Sun icon -->
    <div class="sun-icon">
      <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="6" />
        <rect x="9" y="0" width="2" height="3" rx="1" />
        <rect x="9" y="17" width="2" height="3" rx="1" />
        <rect x="0" y="9" width="3" height="2" rx="1" />
        <rect x="17" y="9" width="3" height="2" rx="1" />
        <rect x="15.5" y="1.5" width="2" height="2" rx="1" />
        <rect x="2.5" y="1.5" width="2" height="2" rx="1" />
        <rect x="15.5" y="16.5" width="2" height="2" rx="1" />
        <rect x="2.5" y="16.5" width="2" height="2" rx="1" />
      </svg>
    </div>

    <!-- Toggle track -->
    <div class="toggle-track">
      <div class="toggle-knob"></div>
    </div>

    <!-- Moon icon -->
    <div class="moon-icon">
      <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 1a8 8 0 1 0 7.5 5.2A6 6 0 0 1 9 1Z" />
      </svg>
    </div>
  </div>
  <a class="gh" href="https://github.com/boblio-max">GitHub</a>
</header>

<main id="view" class="wrap" aria-live="polite"></main>

<div id="tip" class="tip" hidden></div>
<div id="pop" class="pop" hidden></div>

<footer class="wrap foot">
  <span>Nikhil Mahankali · robotics, software, intelligent systems</span>
  <span class="spacer"></span>
  <span>Data: live GitHub API via local server · no mock data</span>
</footer>

<script type="module" src="./script.js"></script>
</body>
</html>
